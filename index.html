<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hany abodonia</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #1e293b; margin-bottom: 5px; text-transform: lowercase; }
        p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 25px; }
        .card-title { font-weight: bold; color: #1e293b; margin-bottom: 15px; display: block; font-size: 16px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; text-align: center; }
        .btn { border: none; padding: 10px 20px; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; margin-bottom: 8px; transition: 0.2s; }
        .btn-blue { background-color: #0284c7; }
        .btn-green { background-color: #16a34a; }
        .btn-red { background-color: #dc2626; }
        .table-title { background: #334155; color: white; padding: 10px; border-radius: 6px 6px 0 0; font-weight: bold; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #e2e8f0; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; font-size: 14px; }
        th { background-color: #f8fafc; color: #334155; }
        .status-badge { background-color: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-out { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>hany abodonia</h1>
        <p class="subtitle">متابعة وتسجيل حركة الصادر والوارد وتنبيهات المخزون بالكاميرا</p>

        <div class="card">
            <span class="card-title">تسجيل عباية جديدة / مسح الباركود</span>
            <div class="form-row">
                <input type="text" id="barcode" placeholder="رقم الباركود">
            </div>
            <button class="btn btn-blue" onclick="alert('زر الكاميرا جاهز لمسح الباركود')">📷 فتح الكاميرا لمسح الباركود</button>
            <div class="form-row">
                <input type="text" id="code" placeholder="الكود (مثال: AB-01)">
                <input type="text" id="model" placeholder="اسم العباية / الموديل">
                <input type="text" id="color" placeholder="اللون">
                <input type="number" id="quantity" placeholder="الكمية" value="1">
            </div>
            <button class="btn btn-green" onclick="addStock()">+ إضافة وارد (إنتاج جديد)</button>
            <button class="btn btn-red" onclick="reduceStock()">- تسجيل صادر (خروج/بيع)</button>
        </div>

        <div class="table-title">📋 جدول المخزون الحالي</div>
        <table>
            <thead>
                <tr>
                    <th>الباركود</th>
                    <th>الكود</th>
                    <th>الموديل</th>
                    <th>اللون</th>
                    <th>الكمية المتاحة</th>
                    <th>حالة المخزون</th>
                </tr>
            </thead>
            <tbody id="inventoryTable">
                <tr><td colspan="6" style="color: #64748b;">لا يوجد عبايات مسجلة بالمخزن حالياً. ابدأ بإضافة وارد جديد!</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchInventory() {
            const res = await fetch('/api/inventory');
            const data = await res.json();
            const tbody = document.getElementById('inventoryTable');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="color: #64748b;">لا يوجد عبايات مسجلة بالمخزن حالياً. ابدأ بإضافة وارد جديد!</td></tr>';
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                const isOut = item.quantity <= 0;
                tr.innerHTML = `
                    <td>${item.barcode}</td>
                    <td>${item.code}</td>
                    <td>${item.model}</td>
                    <td>${item.color}</td>
                    <td><b>${item.quantity}</b></td>
                    <td><span class="status-badge ${isOut ? 'status-out' : ''}">${isOut ? 'نفذت الكمية' : 'متوفر بالمخزن'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function addStock() {
            const barcode = document.getElementById('barcode').value;
            const code = document.getElementById('code').value;
            const model = document.getElementById('model').value;
            const color = document.getElementById('color').value;
            const quantity = document.getElementById('quantity').value;

            if (!code || !quantity) return alert('برجاء كتابة الكود والكمية على الأقل');

            await fetch('/api/inventory/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ barcode, code, model, color, quantity })
            });

            clearInputs();
            fetchInventory();
        }

        async function reduceStock() {
            const barcode = document.getElementById('barcode').value;
            const code = document.getElementById('code').value;
            const color = document.getElementById('color').value;
            const quantity = document.getElementById('quantity').value;

            const res = await fetch('/api/inventory/reduce', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ barcode, code, color, quantity })
            });

            const result = await res.json();
            if (!result.success) {
                alert(result.message);
            } else {
                clearInputs();
                fetchInventory();
            }
        }

        function clearInputs() {
            document.getElementById('barcode').value = '';
            document.getElementById('code').value = '';
            document.getElementById('model').value = '';
            document.getElementById('color').value = '';
            document.getElementById('quantity').value = '1';
        }

        fetchInventory();
    </script>
</body>
</html>
